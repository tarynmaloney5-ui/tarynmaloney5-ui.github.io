<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps by Taryn Maloney</title>
<meta name="description" content="ExamMe and Drawing Wall, Android apps by Taryn Maloney.">
<style>
:root { --bg:#fff; --text:#1f2328; --muted:#636c76; --card:#f4f5f7; --link:#1a73e8; }
@media (prefers-color-scheme: dark) { :root { --bg:#111315; --text:#e6e8ea; --muted:#9aa1a8; --card:#1b1e21; --link:#8ab4f8; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 "Segoe UI", system-ui, sans-serif; }
main { max-width:720px; margin:0 auto; padding:48px 16px; }
h1 { font-size:28px; margin:0 0 4px; }
p.sub { color:var(--muted); margin:0 0 28px; }
a.app { display:flex; gap:16px; align-items:center; background:var(--card); border-radius:16px; padding:16px;
  margin:12px 0; color:inherit; text-decoration:none; }
a.app img { width:64px; height:64px; border-radius:14px; }
a.app b { font-size:18px; display:block; }
a.app span { color:var(--muted); }
footer { margin-top:40px; color:var(--muted); font-size:14px; }
footer a { color:var(--link); }
</style>
</head>
<body>
<main>
<h1>Apps by Taryn Maloney</h1>
<p class="sub">Android apps, now in testing.</p>
<a class="app" href="examme/"><img src="examme/icon.png" alt=""><div><b>ExamMe</b><span>Learn it. Test it. Master it. Practice exams that adapt to you.</span></div></a>
<a class="app" href="drawingwall/"><img src="drawingwall/icon.png" alt=""><div><b>Drawing Wall</b><span>Turn your kids' drawings into a wall of art and picture books.</span></div></a>
<footer>Also by Taryn: <a href="https://canvassflow.com">CanvassFlow</a>, the canvassing app for door-to-door teams.</footer>
</main>
</body>
</html>
